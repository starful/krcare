<footer style="margin-top: 40px; text-align: center; padding: 40px 20px; border-top: 1px solid #eaeaea; background-color: #fff; font-size: 0.9rem; color: #888;">
    <p><strong>{{ site.site_name }} Project</strong><br>{{ site.footer_tagline }}</p>
    <p style="margin-top: 10px; font-size: 0.8rem;">
        <a href="/about.html" style="color: #555; text-decoration: none; margin: 0 10px;">About</a> |
        <a href="/contact.html" style="color: #555; text-decoration: none; margin: 0 10px;">Contact</a> |
        <a href="/privacy.html" style="color: #555; text-decoration: none; margin: 0 10px;">Privacy</a> |
        &copy; {{ site.footer_year }} {{ site.site_name }}
    </p>
</footer>
<script>
document.addEventListener("click", function (event) {
    var target = event.target.closest("[data-track]");
    if (!target || typeof window.gtag !== "function") return;
    var action = target.getAttribute("data-track");
    var label = target.getAttribute("data-track-label") || target.getAttribute("href") || "";
    window.gtag("event", action, {
        event_category: "engagement",
        event_label: label
    });
});
</script>
