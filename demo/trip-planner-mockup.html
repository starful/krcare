<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner UX Mock — OK Series</title>
    <style>
        :root {
            --primary: #3e2723;
            --accent: #f39c12;
            --accent-hover: #e67e22;
            --bg: #fffaf0;
            --card: #fff;
            --muted: #8d6e63;
            --border: #efebe9;
            --saved: #27ae60;
            --panel: #1e293b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--primary);
            background: var(--bg);
            background-image: radial-gradient(var(--accent) 0.5px, transparent 0.5px);
            background-size: 30px 30px;
        }
        .demo-banner {
            background: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 10px 16px;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
        }
        .demo-banner strong { color: #fbbf24; }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,.97);
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 4px 15px rgba(62,39,35,.06);
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .logo {
            font-weight: 900;
            font-size: 1.35rem;
            letter-spacing: -0.03em;
        }
        .logo span { color: var(--accent); }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .btn-trip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: none;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(62,39,35,.2);
            transition: transform .15s, background .15s;
        }
        .btn-trip:hover { transform: translateY(-1px); background: #2c1810; }
        .btn-trip .badge {
            min-width: 1.4em;
            padding: 2px 7px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--primary);
            font-size: 0.78rem;
            text-align: center;
        }

        .layout {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 80px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            align-items: start;
        }

        .map-card {
            background: var(--card);
            border-radius: 20px;
            border: 2px solid var(--border);
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(62,39,35,.08);
        }
        .map-placeholder {
            height: 320px;
            background:
                linear-gradient(135deg, #fff5e6 0%, #ffe8cc 100%),
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(243,156,18,.08) 39px, rgba(243,156,18,.08) 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(243,156,18,.08) 39px, rgba(243,156,18,.08) 40px);
            position: relative;
        }
        .map-placeholder::after {
            content: "Interactive map (existing OK Series UI)";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;
        }
        .map-pin {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50% 50% 50% 0;
            background: var(--accent);
            transform: rotate(-45deg);
            border: 3px solid #fff;
            box-shadow: 0 4px 12px rgba(0,0,0,.2);
        }
        .map-pin:nth-child(1) { top: 28%; left: 42%; }
        .map-pin:nth-child(2) { top: 55%; left: 58%; background: #e74c3c; }
        .map-pin:nth-child(3) { top: 40%; left: 25%; background: #3498db; }
        .map-pin.saved { outline: 3px solid var(--saved); outline-offset: 2px; }

        .section-title {
            margin: 28px 0 14px;
            font-size: 1.1rem;
            font-weight: 800;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        .shop-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: border-color .2s, box-shadow .2s;
        }
        .shop-card.is-saved {
            border-color: var(--saved);
            box-shadow: 0 0 0 1px rgba(39,174,96,.25);
        }
        .shop-thumb {
            height: 120px;
            background: linear-gradient(145deg, #ffecd2, #fcb69f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        .shop-body { padding: 14px 16px 16px; }
        .shop-meta { font-size: 0.75rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
        .shop-name { margin: 4px 0 8px; font-size: 1.05rem; font-weight: 800; line-height: 1.3; }
        .shop-addr { font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
        .shop-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 800;
            border: 1.5px solid var(--border);
            background: #fff;
            cursor: pointer;
            transition: all .15s;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent-hover); }
        .btn-save { flex: 1; min-width: 100px; }
        .btn-save.saved {
            background: #ecfdf5;
            border-color: var(--saved);
            color: #166534;
        }
        .btn-ghost { color: var(--muted); }

        /* Trip panel (sidebar + mobile drawer) */
        .trip-panel {
            position: sticky;
            top: 88px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(62,39,35,.1);
        }
        .trip-panel-head {
            padding: 18px 20px;
            background: linear-gradient(135deg, var(--primary), #5d4037);
            color: #fff;
        }
        .trip-panel-head h2 { margin: 0 0 4px; font-size: 1.15rem; }
        .trip-panel-head p { margin: 0; font-size: 0.82rem; opacity: .85; }
        .trip-list { list-style: none; margin: 0; padding: 12px; max-height: 340px; overflow-y: auto; }
        .trip-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            background: #fafafa;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        .trip-item-num {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--accent);
            color: var(--primary);
            font-weight: 900;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .trip-item-body { flex: 1; min-width: 0; }
        .trip-item-body strong { display: block; font-size: 0.92rem; }
        .trip-item-body small { color: var(--muted); font-size: 0.78rem; }
        .trip-item-remove {
            border: none;
            background: transparent;
            color: #c0392b;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            padding: 4px;
        }
        .trip-empty {
            padding: 32px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .trip-empty span { font-size: 2rem; display: block; margin-bottom: 8px; }
        .trip-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: var(--primary);
            font-weight: 900;
            font-size: 0.92rem;
            cursor: pointer;
        }
        .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
        .btn-secondary {
            width: 100%;
            padding: 10px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--panel);
            color: #fff;
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 600;
            opacity: 0;
            transition: transform .25s, opacity .25s;
            z-index: 200;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Mobile drawer overlay */
        .drawer-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.5);
            z-index: 150;
        }
        .drawer-backdrop.open { display: block; }
        .mobile-drawer {
            display: none;
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .trip-panel.desktop-only { display: none; }
            .mobile-drawer {
                display: block;
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                max-height: 75vh;
                background: var(--card);
                border-radius: 20px 20px 0 0;
                z-index: 160;
                transform: translateY(100%);
                transition: transform .3s ease;
                box-shadow: 0 -10px 40px rgba(0,0,0,.15);
            }
            .mobile-drawer.open { transform: translateY(0); }
            .drawer-handle {
                width: 40px;
                height: 4px;
                background: #ddd;
                border-radius: 999px;
                margin: 10px auto 0;
            }
        }
        @media (min-width: 901px) {
            .btn-trip-mobile-hint { display: none; }
        }
    </style>
</head>
<body>

<p class="demo-banner">
    <strong>UX MOCK</strong> — Trip planner concept for OK Ramen / Onsen / Caddie · not wired to production
</p>

<header>
    <div class="header-inner">
        <div class="logo">OK<span>Ramen</span></div>
        <div class="header-actions">
            <button type="button" class="btn-trip" id="openTripBtn" aria-label="Open my trip">
                🧳 My Trip <span class="badge" id="tripBadge">0</span>
            </button>
        </div>
    </div>
</header>

<div class="layout">
    <div class="main-col">
        <div class="map-card">
            <div class="map-placeholder">
                <div class="map-pin saved" title="Saved"></div>
                <div class="map-pin" title="Shop"></div>
                <div class="map-pin saved" title="Saved"></div>
            </div>
        </div>

        <h2 class="section-title">Tap Save on shops you want to visit</h2>
        <div class="shop-grid" id="shopGrid"></div>
    </div>

    <aside class="trip-panel desktop-only" id="tripPanelDesktop" aria-label="My trip list">
        <div class="trip-panel-head">
            <h2>🧳 My Trip</h2>
            <p>Kyoto · 2 stops · reorder on mobile later</p>
        </div>
        <ul class="trip-list" id="tripListDesktop"></ul>
        <div class="trip-footer">
            <button type="button" class="btn-primary" id="mapsBtnDesktop" disabled>Open in Google Maps</button>
            <button type="button" class="btn-secondary" id="copyBtnDesktop" disabled>Copy list as text</button>
            <button type="button" class="btn-secondary" id="clearBtnDesktop" disabled>Clear all</button>
        </div>
    </aside>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="mobile-drawer" id="mobileDrawer" role="dialog" aria-label="My trip">
    <div class="drawer-handle"></div>
    <div class="trip-panel-head" style="border-radius:0">
        <h2>🧳 My Trip</h2>
        <p id="mobileTripSubtitle">0 stops</p>
    </div>
    <ul class="trip-list" id="tripListMobile"></ul>
    <div class="trip-footer">
        <button type="button" class="btn-primary" id="mapsBtnMobile" disabled>Open in Google Maps</button>
        <button type="button" class="btn-secondary" id="copyBtnMobile" disabled>Copy list</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
    var STORAGE_KEY = "ok_trip_planner_demo_v1";

    var SHOPS = [
        { id: "tenkaippin_kyoto", emoji: "🍜", name: "Tenkaippin Main Shop", area: "Kyoto", style: "Chicken · Kotteri", lat: 35.0355, lng: 135.7811 },
        { id: "ichiran_kyoto", emoji: "🍜", name: "Ichiran Kawaramachi", area: "Kyoto", style: "Tonkotsu", lat: 35.004, lng: 135.769 },
        { id: "menya_saimi", emoji: "🍜", name: "Menya Saimi", area: "Sapporo", style: "Miso", lat: 43.062, lng: 141.354 },
        { id: "afuri_harajuku", emoji: "🍜", name: "Afuri Harajuku", area: "Tokyo", style: "Yuzu shio", lat: 35.669, lng: 139.705 }
    ];

    var trip = loadTrip();

    function loadTrip() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            return [];
        }
    }

    function saveTrip() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(trip));
        render();
    }

    function isSaved(id) {
        return trip.some(function (x) { return x.id === id; });
    }

    function toggleSave(shop) {
        if (isSaved(shop.id)) {
            trip = trip.filter(function (x) { return x.id !== shop.id; });
            toast("Removed from My Trip");
        } else {
            trip.push(shop);
            toast("Added to My Trip ✓");
        }
        saveTrip();
    }

    function toast(msg) {
        var el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        setTimeout(function () { el.classList.remove("show"); }, 2200);
    }

    function googleMapsUrl() {
        if (!trip.length) return "";
        if (trip.length === 1) {
            return "https://www.google.com/maps/search/?api=1&query=" + trip[0].lat + "," + trip[0].lng;
        }
        var origin = trip[0].lat + "," + trip[0].lng;
        var dest = trip[trip.length - 1].lat + "," + trip[trip.length - 1].lng;
        var waypoints = trip.slice(1, -1).map(function (s) { return s.lat + "," + s.lng; }).join("|");
        var url = "https://www.google.com/maps/dir/?api=1&origin=" + origin + "&destination=" + dest + "&travelmode=transit";
        if (waypoints) url += "&waypoints=" + encodeURIComponent(waypoints);
        return url;
    }

    function copyText() {
        var lines = trip.map(function (s, i) {
            return (i + 1) + ". " + s.name + " (" + s.area + ") — " + s.style;
        });
        var text = "My Japan Ramen Trip\n\n" + lines.join("\n") + "\n\nPlanned on OKRamen";
        navigator.clipboard.writeText(text).then(function () { toast("List copied"); });
    }

    function renderShopGrid() {
        var grid = document.getElementById("shopGrid");
        grid.innerHTML = SHOPS.map(function (shop) {
            var saved = isSaved(shop.id);
            return (
                '<article class="shop-card' + (saved ? " is-saved" : "") + '" data-id="' + shop.id + '">' +
                '<div class="shop-thumb">' + shop.emoji + '</div>' +
                '<div class="shop-body">' +
                '<div class="shop-meta">' + shop.area + " · " + shop.style + '</div>' +
                '<div class="shop-name">' + shop.name + '</div>' +
                '<div class="shop-addr">Save → appears in My Trip sidebar</div>' +
                '<div class="shop-actions">' +
                '<button type="button" class="btn btn-save' + (saved ? " saved" : "") + '" data-save="' + shop.id + '">' +
                (saved ? "✓ Saved" : "+ Save to trip") +
                '</button>' +
                '<button type="button" class="btn btn-ghost">Detail →</button>' +
                '</div></div></article>'
            );
        }).join("");

        grid.querySelectorAll("[data-save]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                var id = btn.getAttribute("data-save");
                var shop = SHOPS.find(function (s) { return s.id === id; });
                if (shop) toggleSave(shop);
            });
        });
    }

    function renderTripList(ulId) {
        var ul = document.getElementById(ulId);
        if (!trip.length) {
            ul.innerHTML = '<li class="trip-empty"><span>🗺️</span>Save shops from the list.<br>Your route builds here.</li>';
            return;
        }
        ul.innerHTML = trip.map(function (shop, i) {
            return (
                '<li class="trip-item">' +
                '<span class="trip-item-num">' + (i + 1) + '</span>' +
                '<div class="trip-item-body"><strong>' + shop.name + '</strong><small>' + shop.area + " · " + shop.style + '</small></div>' +
                '<button type="button" class="trip-item-remove" data-remove="' + shop.id + '" aria-label="Remove">×</button>' +
                '</li>'
            );
        }).join("");
        ul.querySelectorAll("[data-remove]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                var id = btn.getAttribute("data-remove");
                trip = trip.filter(function (x) { return x.id !== id; });
                saveTrip();
            });
        });
    }

    function render() {
        document.getElementById("tripBadge").textContent = String(trip.length);
        var sub = document.getElementById("mobileTripSubtitle");
        if (sub) sub.textContent = trip.length + " stop" + (trip.length === 1 ? "" : "s");

        renderShopGrid();
        renderTripList("tripListDesktop");
        renderTripList("tripListMobile");

        var has = trip.length > 0;
        ["Desktop", "Mobile"].forEach(function (suffix) {
            document.getElementById("mapsBtn" + suffix).disabled = !has;
            document.getElementById("copyBtn" + suffix).disabled = !has;
        });
        var clearBtn = document.getElementById("clearBtnDesktop");
        if (clearBtn) clearBtn.disabled = !has;

        var head = document.querySelector(".trip-panel.desktop-only .trip-panel-head p");
        if (head && trip.length) {
            var areas = trip.map(function (s) { return s.area; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
            head.textContent = areas.join(" · ") + " · " + trip.length + " stop" + (trip.length === 1 ? "" : "s");
        }
    }

    function openDrawer() {
        document.getElementById("mobileDrawer").classList.add("open");
        document.getElementById("drawerBackdrop").classList.add("open");
    }
    function closeDrawer() {
        document.getElementById("mobileDrawer").classList.remove("open");
        document.getElementById("drawerBackdrop").classList.remove("open");
    }

    document.getElementById("openTripBtn").addEventListener("click", function () {
        if (window.innerWidth <= 900) openDrawer();
        else document.getElementById("tripPanelDesktop").scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);

    ["Desktop", "Mobile"].forEach(function (suffix) {
        document.getElementById("mapsBtn" + suffix).addEventListener("click", function () {
            var url = googleMapsUrl();
            if (url) window.open(url, "_blank", "noopener,noreferrer");
        });
        document.getElementById("copyBtn" + suffix).addEventListener("click", copyText);
    });
    document.getElementById("clearBtnDesktop").addEventListener("click", function () {
        trip = [];
        saveTrip();
        toast("Trip cleared");
    });

    render();
})();
</script>
</body>
</html>
